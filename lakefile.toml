name = "ZFLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ZFLean", "Imp"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "ZFLean"

# The case study of the paper (a denotational semantics on set-level stores), kept apart from
# the library and written as a client of it: `casestudy/Imp.lean` imports `ZFLean` as any
# downstream project would, and `lake build` builds it with the library.
[[lean_lib]]
name = "Imp"
srcDir = "casestudy"
