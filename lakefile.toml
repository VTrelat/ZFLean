name = "ZFLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ZFLean", "Imp"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "ZFLean"

# The case study of the paper (a denotational semantics on set-level stores), kept apart from
# the library and written as a client of it: `casestudy/Imp.lean` imports `ZFLean` as any
# downstream project would, and `lake build` builds it with the library.
[[lean_lib]]
name = "Imp"
srcDir = "casestudy"

# The obligation harness of the paper's evaluation: the case study's 30 leaf obligations under
# plain `solve_by_elim`, the library's seeds only, and the full environment. Self-verifying —
# `lake build ImpObligations` certifies the counts reported in the paper. Not a default target.
[[lean_lib]]
name = "ImpObligations"
srcDir = "casestudy"
